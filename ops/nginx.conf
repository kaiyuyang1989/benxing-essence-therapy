user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    server {
        listen 127.0.0.1:8080;
        server_name essencetherapy.cn www.essencetherapy.cn;
        root /var/www/essencetherapy;
        index index.html;
        location / { try_files $uri $uri/ =404; }
    }

    server {
        listen 80;
        server_name essencetherapy.cn www.essencetherapy.cn;
        root /var/www/essencetherapy;
        location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
        location / { return 301 https://essencetherapy.cn$request_uri; }
    }

    server {
        listen 443 ssl http2;
        server_name essencetherapy.cn;
        ssl_certificate /etc/letsencrypt/live/essencetherapy.cn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/essencetherapy.cn/privkey.pem;
        root /var/www/essencetherapy;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        location / { try_files $uri $uri/ =404; }
    }

    server {
        listen 443 ssl http2;
        server_name www.essencetherapy.cn;
        ssl_certificate /etc/letsencrypt/live/essencetherapy.cn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/essencetherapy.cn/privkey.pem;
        return 301 https://essencetherapy.cn$request_uri;
    }
}
